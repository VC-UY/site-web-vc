name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deployer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude 'venv' --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/vc-uy/SITE/

      - name: Rebuild and restart Site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/vc-uy
            COMPOSE_FILE=deploy/docker-compose.prod.yml
            ENV_FILE=deploy/.env.production
            # Toujours rafraîchir le helper depuis le dépôt Site (évite drift VPS)
            mkdir -p deploy/scripts
            if [ -f SITE/deploy-helpers/compose-up-retry.sh ]; then
              cp SITE/deploy-helpers/compose-up-retry.sh deploy/scripts/compose-up-retry.sh
            fi
            chmod +x deploy/scripts/compose-up-retry.sh

            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build site-backend site-frontend

            # --no-deps : ne recrée PAS coordinator/proxy (conflits de noms CI)
            COMPOSE_UP_NO_DEPS=1 deploy/scripts/compose-up-retry.sh \
              "$COMPOSE_FILE" "$ENV_FILE" site-backend site-frontend

            for i in 1 2 3 4 5 6 7 8; do
              curl -sf http://127.0.0.1:8003/health/ && break
              sleep 8
            done
            curl -sf http://127.0.0.1:8003/health/
            curl -sf http://127.0.0.1:13100/ >/dev/null
            echo "Site OK"

      - name: Smoke test public URL
        run: curl -sf https://vc-uy.npe-techs.com/api/health/
